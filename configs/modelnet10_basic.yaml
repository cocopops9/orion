# ORION Basic config for ModelNet10
# Baseline architecture matching original paper

model:
  arch: basic
  num_classes: 10
  num_orientations: 105  # Sum from poseplan: 6+12+12+12+12+12+12+12+3+12

data:
  train_hdf5_list: datasets/modelnet10/hdf5/train_allrot_shuffled/train.hdf5.txt
  val_hdf5_list: datasets/modelnet10/hdf5/test_singlerandrot/test.hdf5.txt

augmentation:
  train:
    offset_from: [0, 0, 0]
    offset_to: [4, 4, 4]
  test:
    offset_from: [2, 2, 2]
    offset_to: [2, 2, 2]

training:
  batch_size: 32
  val_batch_size: 908     # Full test set
  num_epochs: 50
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  gamma: 0.5              # Paper Equation 2: L = (1-gamma)*L_C + gamma*L_O
  label_smoothing: 0.0
  scheduler: step
  lr_step_size: 20
  lr_gamma: 0.1
  save_dir: checkpoints/modelnet10_basic
  save_every: 10
  num_workers: 4
